name: PadServer
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  PadServerCore:
    path: Packages/PadServerCore
  PadGuest:
    path: Packages/PadGuest
targets:
  PadServer:
    type: application
    platform: iOS
    sources:
      - App
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    postBuildScripts:
      - name: Copy guest artifacts
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/guest"
          rm -rf "${dest}"
          for name in bzImage initrd.img; do
            src="${SRCROOT}/build/guest/${name}"
            if [ -f "${src}" ]; then
              mkdir -p "${dest}"
              cp -f "${src}" "${dest}/${name}"
            elif [ "${CONFIGURATION}" = "Release" ]; then
              echo "error: ${src} is missing. Run guest/build-kernel.sh and guest/build-rootfs.sh first."
              exit 1
            else
              echo "warning: ${src} is missing, so the app is built without it."
            fi
          done
      - name: Copy QEMU libraries
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          frameworks_dest="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          bios_dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/guest/pc-bios"
          frameworks_src="${SRCROOT}/build/qemu/ios/Frameworks"
          bios_src="${SRCROOT}/build/sources/qemu/pc-bios"
          missing() {
            if [ "${CONFIGURATION}" = "Release" ]; then
              echo "error: $1 is missing. Run scripts/build-qemu.sh first."
              exit 1
            fi
            echo "warning: $1 is missing, so the app is built without it."
          }
          rm -rf "${bios_dest}"
          if [ -d "${bios_src}" ]; then
            mkdir -p "${bios_dest}"
            cp -RL "${bios_src}/." "${bios_dest}"
          else
            missing "${bios_src}"
          fi
          found=0
          for src in "${frameworks_src}"/*.framework; do
            [ -d "${src}" ] || continue
            found=1
            mkdir -p "${frameworks_dest}"
            dest="${frameworks_dest}/$(basename "${src}")"
            rm -rf "${dest}"
            cp -R "${src}" "${dest}"
            if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
              /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" --timestamp=none "${dest}"
            fi
          done
          if [ "${found}" = 0 ]; then
            missing "${frameworks_src}"
          fi
    dependencies:
      - package: PadServerCore
        product: PadDomain
      - package: PadServerCore
        product: PadApplication
      - package: PadServerCore
        product: PadInterface
      - package: PadServerCore
        product: PadInfrastructure
      - package: PadGuest
        product: PadGuest
schemes:
  PadServer:
    build:
      targets:
        PadServer: all
    run:
      config: Debug
    archive:
      config: Release
