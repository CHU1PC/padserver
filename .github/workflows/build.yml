name: build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core
    runs-on: macos-26
    # 依存のコンパイルが長引いても, runner を保持し続けないため.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
      - name: Build and test PadServerCore
        working-directory: Packages/PadServerCore
        run: |
          swift build
          swift test
      - name: Build and test PadGuest
        working-directory: Packages/PadGuest
        run: |
          swift build
          swift test

  cli:
    name: cli
    runs-on: macos-26
    # 依存のコンパイルが長引いても, runner を保持し続けないため.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
      - name: Build and run padctl
        working-directory: cli
        run: |
          swift build
          swift test
          swift run padctl --version

  relay:
    name: relay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install relay dependencies
        working-directory: relay
        run: bun install --frozen-lockfile
      - name: Typecheck relay
        working-directory: relay
        run: bun run typecheck
      - name: Test relay
        working-directory: relay
        run: bun test

  app:
    name: app
    runs-on: macos-26
    # 依存のコンパイルが長引いても, runner を保持し続けないため.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and build app
        run: |
          xcodegen generate
          xcodebuild -project PadServer.xcodeproj -scheme PadServer \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
