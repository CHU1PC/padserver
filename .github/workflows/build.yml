name: build

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core
    runs-on: macos-26
    # 依存のコンパイルが長引いても, runner を保持し続けないため.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain versions
        id: tc
        run: |
          swift --version
          xcodebuild -version
          echo "key=${RUNNER_OS}-${RUNNER_ARCH}-$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            Packages/PadServerCore/.build
            Packages/PadGuest/.build
          key: swiftpm-core-${{ steps.tc.outputs.key }}-${{ hashFiles('Packages/*/Package.resolved') }}
          restore-keys: |
            swiftpm-core-${{ steps.tc.outputs.key }}-
      - name: Build and test packages
        run: scripts/ci/core.sh

  cli:
    name: cli
    runs-on: macos-26
    # 依存のコンパイルが長引いても, runner を保持し続けないため.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain versions
        id: tc
        run: |
          swift --version
          xcodebuild -version
          echo "key=${RUNNER_OS}-${RUNNER_ARCH}-$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            cli/.build
          key: swiftpm-cli-${{ steps.tc.outputs.key }}-${{ hashFiles('cli/Package.resolved') }}
          restore-keys: |
            swiftpm-cli-${{ steps.tc.outputs.key }}-
      - name: Build and run padctl
        run: scripts/ci/cli.sh

  relay:
    name: relay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install, typecheck and test relay
        run: scripts/ci/relay.sh

  app:
    name: app
    runs-on: macos-26
    # 依存のコンパイルが長引いても, runner を保持し続けないため.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain versions
        id: tc
        run: |
          swift --version
          xcodebuild -version
          echo "key=${RUNNER_OS}-${RUNNER_ARCH}-$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"
      - name: Cache DerivedData
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/DerivedData
          key: dd-app-${{ steps.tc.outputs.key }}-${{ hashFiles('project.yml', 'Packages/*/Package.resolved') }}
          restore-keys: |
            dd-app-${{ steps.tc.outputs.key }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and build app
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
        run: scripts/ci/app.sh
